# Nginx Server Block Configuration for SmartBudget
# Domain: livingsacrifice.my.id
# Optimized for 1 vCPU & 1 GiB RAM (Static file offloading)

server {
    listen 80;
    listen [::]:80;
    server_name livingsacrifice.my.id www.livingsacrifice.my.id;

    # Maximum upload size for CSV imports
    client_max_body_size 10M;

    # Offload static files directly to Nginx to save Python CPU cycles
    location /static/ {
        alias /var/www/budget-app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Reverse proxy dynamic requests to Gunicorn WSGI
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Security: Deny access to hidden files (.git, .env, sqlite db files)
    location ~ /\.(?!well-known).* {
        deny all;
    }
    location ~* \.db$ {
        deny all;
    }
}
